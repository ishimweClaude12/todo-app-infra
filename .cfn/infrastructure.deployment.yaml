# Git sync stack deployment file for the Todo App infrastructure stack.
# Point Git sync at this file when you create the stack from repository source.
template-file-path: templates/infrastructure.yaml
parameters:
  ProjectName: todo-app
  # Prefix in the artifact bucket holding the nested templates. Managed by
  # scripts/publish-templates.sh (run by the publish-templates workflow).
  TemplatesPrefix: infra-templates/v1
  # "true" adds a standby database in the second AZ (HA, roughly double cost).
  DBMultiAZ: "false"
  # "true" runs a Redis replica in the second AZ with automatic failover.
  RedisMultiAZ: "true"
# Stack tags propagate to every nested stack and every taggable resource.
tags:
  Project: todo-app
  Environment: dev
  Owner: claude-ishimwe
  CostCenter: todo-app-lab
  ManagedBy: cloudformation-git-sync
