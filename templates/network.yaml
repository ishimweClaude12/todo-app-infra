AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Todo App network layer: a multi-AZ VPC with five tiers, each spread over two
  Availability Zones. Public subnets hold the ALB only; ECS tasks, the RDS
  instance, the RDS Proxy and the ElastiCache nodes each get their own
  dedicated private subnets. There is no NAT gateway: the app tier reaches AWS
  services through VPC endpoints, and the data, proxy and cache tiers have no
  route out of the VPC at all.

Parameters:
  ProjectName:
    Type: String
    Description: Prefix used to name and tag all resources.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24
  AppSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24
  AppSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24
  DataSubnet1Cidr:
    Type: String
    Default: 10.0.20.0/24
  DataSubnet2Cidr:
    Type: String
    Default: 10.0.21.0/24
  ProxySubnet1Cidr:
    Type: String
    Default: 10.0.30.0/24
  ProxySubnet2Cidr:
    Type: String
    Default: 10.0.31.0/24
  CacheSubnet1Cidr:
    Type: String
    Default: 10.0.40.0/24
  CacheSubnet2Cidr:
    Type: String
    Default: 10.0.41.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-vpc' }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-igw' }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # --- Public tier (ALB only) -----------------------------------------------
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-public-1' }
        - { Key: Tier, Value: public }

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-public-2' }
        - { Key: Tier, Value: public }

  # --- App tier (ECS tasks + interface endpoints) ---------------------------
  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-app-1' }
        - { Key: Tier, Value: app }

  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-app-2' }
        - { Key: Tier, Value: app }

  # --- Data tier (RDS instance) ---------------------------------------------
  DataSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DataSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-data-1' }
        - { Key: Tier, Value: data }

  DataSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DataSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-data-2' }
        - { Key: Tier, Value: data }

  # --- Proxy tier (RDS Proxy) -----------------------------------------------
  ProxySubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref ProxySubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-proxy-1' }
        - { Key: Tier, Value: proxy }

  ProxySubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref ProxySubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-proxy-2' }
        - { Key: Tier, Value: proxy }

  # --- Cache tier (ElastiCache Redis) ---------------------------------------
  CacheSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref CacheSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-cache-1' }
        - { Key: Tier, Value: cache }

  CacheSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref CacheSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-cache-2' }
        - { Key: Tier, Value: cache }

  # --- Routing --------------------------------------------------------------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-public-rt' }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # App tier: local routes plus the S3 gateway endpoint route (added by the
  # VPC endpoint stack). No NAT and no internet route.
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-app-rt' }

  AppSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet1
      RouteTableId: !Ref AppRouteTable

  AppSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet2
      RouteTableId: !Ref AppRouteTable

  # Data, proxy and cache tiers: local routes only. Nothing in them can reach
  # outside the VPC.
  IsolatedRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-isolated-rt' }

  DataSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnet1
      RouteTableId: !Ref IsolatedRouteTable

  DataSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnet2
      RouteTableId: !Ref IsolatedRouteTable

  ProxySubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProxySubnet1
      RouteTableId: !Ref IsolatedRouteTable

  ProxySubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProxySubnet2
      RouteTableId: !Ref IsolatedRouteTable

  CacheSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref CacheSubnet1
      RouteTableId: !Ref IsolatedRouteTable

  CacheSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref CacheSubnet2
      RouteTableId: !Ref IsolatedRouteTable

Outputs:
  VpcId:
    Value: !Ref Vpc
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
  AppSubnet1Id:
    Value: !Ref AppSubnet1
  AppSubnet2Id:
    Value: !Ref AppSubnet2
  DataSubnet1Id:
    Value: !Ref DataSubnet1
  DataSubnet2Id:
    Value: !Ref DataSubnet2
  ProxySubnet1Id:
    Value: !Ref ProxySubnet1
  ProxySubnet2Id:
    Value: !Ref ProxySubnet2
  CacheSubnet1Id:
    Value: !Ref CacheSubnet1
  CacheSubnet2Id:
    Value: !Ref CacheSubnet2
  AppRouteTableId:
    Value: !Ref AppRouteTable
